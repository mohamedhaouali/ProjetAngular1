
  <!-- ================ contact section start ================= -->
  <section class="contact-section section_padding">
    <div class="container">
 


      <div class="row">
        <div class="col-12">
          <h2 class="contact-title">Edit Chef</h2>
        </div>
        <div class="col-lg-8">
    
             <form class="form-contact contact_form" #chefForm="ngForm" (ngSubmit)="editChef()" ></form>
            <div class="row">
           
              <div class="col-sm-12">
                <div class="form-group">
                  <input type="text" [(ngModel)]="chef.name" name ="name" class="form-control" placeholder="name">
                  
                </div>
              </div>


              <div class="col-sm-12">
                <div class="form-group">
                   <input type="text" [(ngModel)]="chef.specialite"  name ="specialite" class="form-control" placeholder="specialite">
                </div>
              </div>

                 <div class="col-sm-12">
                <div class="form-group">
                   <input type="number" [(ngModel)]="chef.exprience"  name ="exprience" class="form-control" placeholder="exprience">
                </div>
              </div>


          
            </div>
            <div class="form-group mt-3">
              <button type="submit" (click)="editChef()" value="editChef" class="button button-contactForm btn_4">Edit</button>
            </div>
          
        </div>
        <div class="col-lg-4">
          <div class="media contact-info">
            <span class="contact-info__icon"><i class="ti-home"></i></span>
            <div class="media-body">
              <h3>Buttonwood, California.</h3>
              <p>Rosemead, CA 91770</p>
            </div>
          </div>
          <div class="media contact-info">
            <span class="contact-info__icon"><i class="ti-tablet"></i></span>
            <div class="media-body">
              <h3>00 (440) 9865 562</h3>
              <p>Mon to Fri 9am to 6pm</p>
            </div>
          </div>
          <div class="media contact-info">
            <span class="contact-info__icon"><i class="ti-email"></i></span>
            <div class="media-body">
              <h3>supportcolorlib.com</h3>
              <p>Send us your query anytime!</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
