
  <!-- ================ contact section start ================= -->
  <section class="contact-section section_padding">
    <div class="container">
 


      <div class="row">
        <div class="col-12">
          <h2 class="contact-title">Get in Touch</h2>
        </div>
        <div class="col-lg-8">

          <form class="form-contact contact_form" #loginForm="ngForm" (ngSubmit)="addlogin()"
           action="contact_process.php" method="post" id="contactForm"
            novalidate="novalidate">

            <div class="row">
           
              <div class="col-sm-12">
                <div class="form-group">
                  <input class="form-control" type="email" [(ngModel)]="login.name" name="email" id="name"  onfocus="this.placeholder = ''"
                    onblur="this.placeholder = 'Enter your email'" placeholder='Enter your email'>
                </div>
              </div>
              <div class="col-sm-12">
                <div class="form-group">
                  <input class="form-control" type="password" [(ngModel)]="login.password"  name="password" id="email"  onfocus="this.placeholder = ''"
                    onblur="this.placeholder = 'Enter password'" placeholder='Enter password'>
                </div>
              </div>
          
            </div>
            <div class="form-group mt-3">
              <button type="submit" class="button button-contactForm btn_4">Send Message</button>
            </div>
          </form>
        </div>
        <div class="col-lg-4">
          <div class="media contact-info">
            <span class="contact-info__icon"><i class="ti-home"></i></span>
            <div class="media-body">
              <h3>Buttonwood, California.</h3>
              <p>Rosemead, CA 91770</p>
            </div>
          </div>
          <div class="media contact-info">
            <span class="contact-info__icon"><i class="ti-tablet"></i></span>
            <div class="media-body">
              <h3>00 (440) 9865 562</h3>
              <p>Mon to Fri 9am to 6pm</p>
            </div>
          </div>
          <div class="media contact-info">
            <span class="contact-info__icon"><i class="ti-email"></i></span>
            <div class="media-body">
              <h3>supportcolorlib.com</h3>
              <p>Send us your query anytime!</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
