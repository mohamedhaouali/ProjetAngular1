<table class="table">
  <thead>
    <tr>
    <th>ID</th>  
    <th> Name</th>
    <th>Specialite</th>
    <th>Exprience</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let element of chefsTab">
      <th >{{ element.id }}</th>
      <td>{{ element.name }}</td>
      <td>{{ element.specialite }}</td>
      <td>{{ element.exprience }}</td>
      <td>
        <button class="btn btn-info" (click)="displayChef(element.id)">Display</button>
        <button class="btn btn-warning" (click)="editChef(element.id)">Edit</button>
        <button class="btn btn-danger"(click)="deleteChef(element.id)">Delete</button>
      </td>
    </tr>

  </tbody>
</table>
